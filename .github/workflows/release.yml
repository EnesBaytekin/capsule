name: Build and Release Docker Images

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: enesbaytekin/capsule-server
  FRONTEND_IMAGE: enesbaytekin/capsule-ui

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Prepare release assets
        run: |
          # Create release directory structure
          mkdir -p release-package/config
          mkdir -p release-package/certs

          # Copy docker-compose file
          cp docker-compose.release.yml release-package/docker-compose.yml

          # Create .env file with example values
          cat > release-package/.env << 'EOF'
          # ========================================
          # Time Capsule - Environment Configuration
          # ========================================
          #
          # IMPORTANT: Review and update these values before starting the application.
          # Generate a strong JWT_SECRET for production use.

          # JWT Secret - REQUIRED
          # Used to sign authentication tokens.
          # Generate a secure secret with: openssl rand -base64 32
          # CHANGE THIS IN PRODUCTION!
          JWT_SECRET=change-this-to-a-strong-random-secret-use-openssl-rand-base64-32

          # Whitelist Feature
          # Set to 'true' to only allow usernames listed in config/whitelist.txt to register.
          # Set to 'false' to allow anyone to register.
          USE_WHITELIST=false

          # Whitelist File Path
          # Points to the whitelist file inside the container.
          # Changes to this file take effect immediately without restart.
          WHITELIST_FILE=/app/config/whitelist.txt
          EOF

          # Create whitelist.txt with only comments
          cat > release-package/config/whitelist.txt << 'EOF'
          # ========================================
          # Time Capsule - Username Whitelist
          # ========================================
          #
          # This file is used to control who can register when USE_WHITELIST=true in .env
          #
          # Format:
          # - One username per line
          # - Case-sensitive (bob, Bob, and BOB are different)
          # - Lines starting with # are comments and ignored
          # - Empty lines are ignored
          #
          # Example:
          # alice
          # bob
          # charlie
          #
          # Note: Changes to this file take effect immediately without requiring a restart.
          #
          EOF

          # Create deployment-specific README
          cat > release-package/README.md << 'EOF'
          # Time Capsule - Deployment Guide

          Time Capsule is a self-hosted, zero-knowledge encrypted storage application where data is encrypted on the client side before upload. The server never sees private keys and cannot decrypt user data.

          ## Prerequisites

          - **Docker:** 20.10 or later
          - **Docker Compose:** 2.0 or later
          - **Ports:** 8443 (backend API) and 3443 (frontend) must be available

          Install Docker:
          ```bash
          curl -fsSL https://get.docker.com | sh
          ```

          ## SSL/TLS Certificates (REQUIRED)

          Time Capsule runs **HTTPS only**. You must provide SSL certificates in the `certs/` directory:

          ```
          certs/
            cert.pem  # SSL certificate
            key.pem   # SSL private key
          ```

          ### Generate Self-Signed Certificates (For Testing)

          For testing or development, generate self-signed certificates:

          ```bash
          # On Linux/Mac
          openssl req -x509 -newkey rsa:4096 \
            -keyout certs/key.pem \
            -out certs/cert.pem \
            -days 365 \
            -nodes \
            -subj "/C=US/ST=State/L=City/O=Capsule/CN=localhost"

          # Set proper permissions
          chmod 644 certs/cert.pem
          chmod 600 certs/key.pem
          ```

          **Note:** Self-signed certificates will cause browser security warnings. For production, use Let's Encrypt or commercial certificates.

          ### Let's Encrypt Certificates (For Production)

          For production, use free trusted certificates from Let's Encrypt:

          ```bash
          # Install certbot
          sudo apt-get install -y certbot

          # Generate certificates (use your actual domain)
          sudo certbot certonly --standalone -d capsule.yourdomain.com

          # Copy certificates to this directory
          sudo cp /etc/letsencrypt/live/capsule.yourdomain.com/fullchain.pem certs/cert.pem
          sudo cp /etc/letsencrypt/live/capsule.yourdomain.com/privkey.pem certs/key.pem

          # Set permissions
          sudo chown $USER:$USER certs/*.pem
          chmod 644 certs/cert.pem
          chmod 600 certs/key.pem
          ```

          ## Configuration

          ### 1. Environment Variables (.env)

          Edit the `.env` file and configure at minimum:

          ```bash
          # Generate a strong secret
          JWT_SECRET=$(openssl rand -base64 32)

          # Update .env file with this value
          ```

          The `.env` file contains inline documentation for all variables.

          ### 2. Username Whitelist (Optional)

          To restrict registration to specific usernames:

          1. Set `USE_WHITELIST=true` in `.env`
          2. Edit `config/whitelist.txt` and add usernames (one per line)

          Changes to `whitelist.txt` take effect immediately without restart.

          ## Deployment

          Start the application:

          ```bash
          docker compose up -d
          ```

          Access Time Capsule:
          - **Frontend:** https://localhost:3443
          - **Backend API:** https://localhost:8443

          ## Useful Commands

          ```bash
          # View logs
          docker compose logs -f

          # Stop the application
          docker compose down

          # Restart the application
          docker compose restart

          # Update to latest version
          docker compose pull
          docker compose up -d
          ```

          ## Troubleshooting

          **Browser shows "Your connection is not private":**
          - You're using self-signed certificates (normal for testing)
          - Click "Advanced" → "Proceed to localhost" to continue
          - For production, use Let's Encrypt certificates

          **Container won't start:**
          ```bash
          # Check if certificates exist
          ls -la certs/

          # Check logs
          docker compose logs backend
          docker compose logs frontend
          ```

          **Permission denied on certificates:**
          ```bash
          chmod 644 certs/cert.pem
          chmod 600 certs/key.pem
          ```

          ## Security Notes

          - Never share your `.env` file (contains JWT_SECRET)
          - Use strong, unique JWT_SECRET in production
          - Keep certificate private keys secure (`key.pem` should be readable only by owner)
          - Regularly update Docker images: `docker compose pull && docker compose up -d`

          ## Documentation

          For detailed documentation, see:
          - [Full Project Documentation](https://github.com/enesbaytekin/capsule)
          - [Deployment Guide](https://github.com/enesbaytekin/capsule/blob/main/docs/DEPLOYMENT.md)
          - [Project Structure](https://github.com/enesbaytekin/capsule/blob/main/PROJECT_STRUCTURE.md)
          EOF

          # Create zip file
          cd release-package
          zip -r ../capsule-release-${{ steps.version.outputs.VERSION }}.zip .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            capsule-release-${{ steps.version.outputs.VERSION }}.zip
          generate_release_notes: true
          body: |
            ## Time Capsule Release ${{ steps.version.outputs.VERSION }}

            ### 📦 Docker Images
            - **Backend:** `enesbaytekin/capsule-server:latest` or `enesbaytekin/capsule-server:${{ steps.version.outputs.VERSION }}`
            - **Frontend:** `enesbaytekin/capsule-ui:latest` or `enesbaytekin/capsule-ui:${{ steps.version.outputs.VERSION }}`

            ### 🚀 Quick Start

            1. **Download the release:**
               ```bash
               wget https://github.com/enesbaytekin/capsule/releases/download/v${{ steps.version.outputs.VERSION }}/capsule-release-${{ steps.version.outputs.VERSION }}.zip
               unzip capsule-release-${{ steps.version.outputs.VERSION }}.zip
               cd capsule-release-${{ steps.version.outputs.VERSION }}
               ```

            2. **Generate SSL certificates:**
               ```bash
               # For testing (self-signed certificates)
               openssl req -x509 -newkey rsa:4096 \
                 -keyout certs/key.pem \
                 -out certs/cert.pem \
                 -days 365 \
                 -nodes \
                 -subj "/C=US/ST=State/L=City/O=Capsule/CN=localhost"
               chmod 644 certs/cert.pem
               chmod 600 certs/key.pem
               ```

            3. **Configure environment:**
               ```bash
               # Edit .env and generate a secure JWT_SECRET
               openssl rand -base64 32
               # Copy the output and replace JWT_SECRET in .env file
               ```

            4. **Start the application:**
               ```bash
               docker compose up -d
               ```

            5. **Access Time Capsule:**
               - Frontend: https://localhost:3443
               - Backend API: https://localhost:8443

            ### 📁 Package Structure

            ```
            capsule-release-${{ steps.version.outputs.VERSION }}.zip
            ├── docker-compose.yml      # Docker Compose configuration
            ├── .env                    # Environment variables (edit this!)
            ├── config/
            │   └── whitelist.txt       # Username whitelist (optional)
            ├── certs/                  # Put your SSL certificates here
            └── README.md               # Deployment guide
            ```

            ### 📖 Documentation

            See the README.md file in the package for detailed deployment instructions.

            For more information:
            - [Full Project Documentation](https://github.com/enesbaytekin/capsule)
            - [Deployment Guide](https://github.com/enesbaytekin/capsule/blob/main/docs/DEPLOYMENT.md)
            - [Project Structure](https://github.com/enesbaytekin/capsule/blob/main/PROJECT_STRUCTURE.md)

            ### ⚠️ Important Notes

            - **SSL Certificates:** Required for HTTPS-only operation. Place `cert.pem` and `key.pem` in `certs/`
            - **JWT Secret:** Must be changed from the default value in `.env`
            - **Whitelist:** Optional feature to restrict registration (edit `config/whitelist.txt`)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
