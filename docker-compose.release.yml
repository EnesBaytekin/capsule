# Time Capsule - Production Docker Compose
# This file is for production deployments using pre-built Docker Hub images
#
# Architecture:
# - Reverse Proxy (nginx) exposed on port 443
# - Frontend and Backend accessible only through reverse proxy
# - Environment variables read from .env file
#
# Quick Start:
# 1. Edit .env and set JWT_SECRET
# 2. Place SSL certificates in certs/ directory (cert.pem and key.pem)
# 3. Run: docker compose up -d

services:
  # Reverse Proxy (nginx)
  # Entry point for all traffic - routes to frontend/backend
  proxy:
    image: nginx:alpine
    container_name: capsule-proxy
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./.release/nginx-proxy.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - capsule-network

  # Backend API (HTTPS only, internal only)
  backend:
    image: enesbaytekin/capsule-server:latest
    container_name: capsule-backend
    # No port mapping - accessible only through reverse proxy
    volumes:
      - backend-data:/app/data
      - ./certs:/app/certs:ro
      - ./config:/app/config:ro
    environment:
      - PORT=8443
      - DATABASE_PATH=/app/data/capsule.db
      - STORAGE_PATH=/app/data/users
      - JWT_SECRET=${JWT_SECRET}
      - TLS_CERT=/app/certs/cert.pem
      - TLS_KEY=/app/certs/key.pem
      - USE_WHITELIST=${USE_WHITELIST:-false}
      - WHITELIST_FILE=/app/config/whitelist.txt
    restart: unless-stopped
    networks:
      - capsule-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8443"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend (HTTPS only, internal only)
  frontend:
    image: enesbaytekin/capsule-ui:latest
    container_name: capsule-frontend
    # No port mapping - accessible only through reverse proxy
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - capsule-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3443"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  backend-data:
    driver: local

networks:
  capsule-network:
    driver: bridge
