services:
  # Backend API (HTTPS only)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: capsule-backend
    ports:
      - "8443:8443"
    volumes:
      - backend-data:/app/data
      - backend-certs:/app/certs
    environment:
      - PORT=8443
      - DATABASE_PATH=/app/data/capsule.db
      - STORAGE_PATH=/app/data/users
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - TLS_CERT=/app/certs/cert.pem
      - TLS_KEY=/app/certs/key.pem
    restart: unless-stopped
    networks:
      - capsule-network

  # Frontend (HTTPS only)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: capsule-frontend
    ports:
      - "3443:3443"
    volumes:
      - frontend-certs:/app/certs
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - capsule-network

volumes:
  backend-data:
    driver: local
  backend-certs:
    driver: local
  frontend-certs:
    driver: local

networks:
  capsule-network:
    driver: bridge
